name: 🐛 Bug Report
description: Report a bug, unexpected behavior, or broken installer
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much relevant information as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the problem.
      placeholder: |
        1. Run command '...'
        2. Give agent prompt '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Which environment or agent tool are you using?
      options:
        - Codex
        - Claude Code / Claude Desktop
        - Antigravity / Gemini
        - Cursor / Windsurf
        - Shell / CLI installer
        - Other
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, logs, or screenshots about the problem here.
